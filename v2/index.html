<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DBC 2">
<meta name="theme-color" content="#00213F">
<meta name="format-detection" content="telephone=no">
<title>DBC Gases e Locações v2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: fundo em degradê suave, saudação grande, cartão de destaque marinho com pílulas translúcidas, cartões brancos com ícone em quadrado suave, barra inferior com botão central redondo. */
:root{
  --bg-top:#DDE8F3; --bg:#F5F7FA; --card:#FFFFFF; --ink:#0D1B2A; --muted:#66768A; --line:#E3E9F0;
  --tint:#E8F0F8; --tint-ink:#0E3A66; --navy:#00213F; --navy-2:#0D4677; --orange:#F28A26; --orange-ink:#FFFFFF;
  --ok:#17824B; --ok-bg:#E3F4EA; --warn:#9A5600; --warn-bg:#FFF1DE;
  --shadow:0 12px 30px -18px rgba(0,33,63,.35); --scrim:rgba(0,20,40,.45);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(18px,env(safe-area-inset-left,0px)); --gr:max(18px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-top:#0D2440; --bg:#07111C; --card:#0F1D2D; --ink:#EAF0F7; --muted:#97A8BB; --line:#1D3047;
  --tint:#16304B; --tint-ink:#8CC6EC; --navy:#0A3460; --navy-2:#1A5E98; --ok:#4CC683; --ok-bg:#0F2A1C; --warn:#F2B35A; --warn-bg:#2A1F0D;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg-top:#0D2440; --bg:#07111C; --card:#0F1D2D; --ink:#EAF0F7; --muted:#97A8BB; --line:#1D3047;
  --tint:#16304B; --tint-ink:#8CC6EC; --navy:#0A3460; --navy-2:#1A5E98; --ok:#4CC683; --ok-bg:#0F2A1C; --warn:#F2B35A; --warn-bg:#2A1F0D;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 420px) no-repeat,var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--st);z-index:40;background:var(--bg-top)}
button{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.w{max-width:720px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
#view{padding-bottom:calc(120px + var(--sb))}
svg.i{width:22px;height:22px;flex:none}

/* top */
.top{padding-block:22px 6px;display:flex;flex-direction:column;gap:14px}
.chip-store{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:16px;font-weight:500;width:max-content;max-width:100%}
.chip-store .lg{height:40px;padding:0 12px;border-radius:12px;background:#00213F;display:grid;place-items:center;flex:none}
.chip-store .lg svg{height:28px;width:auto;display:block}
.chip-store .i{width:18px;height:18px}
.hrow{display:flex;align-items:center;gap:8px}
.hello{font-size:clamp(32px,9vw,42px);font-weight:600;letter-spacing:-.025em;margin:0;flex:1;line-height:1.05}
.tb{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--tint-ink);position:relative;flex:none}
.tb .i{width:24px;height:24px}
.dotn{position:absolute;top:2px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg-top)}
.storeline{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:-6px}
.storeline a{display:inline-flex;align-items:center;gap:5px}
.storeline .i{width:14px;height:14px;color:var(--orange)}

/* hero card */
.hero{margin-top:18px;border-radius:30px;padding:22px 20px 20px;color:#fff;background:radial-gradient(120% 90% at 0% 0%,#1C6BA8 0%,transparent 55%),linear-gradient(160deg,#0E4C82 0%,#00213F 78%);box-shadow:0 24px 40px -24px rgba(0,33,63,.7);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(242,138,38,.35),transparent 70%);pointer-events:none}
.hero-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.hero-h span{font-size:17px;font-weight:500;color:#D7E5F3}
.pill-t{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500;white-space:nowrap}
.prow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:0;border-radius:16px;padding:13px 16px;color:#fff;font-size:16.5px;font-weight:500;text-align:left;cursor:pointer;width:100%;line-height:1.3}
.prow span{flex:1}
.prow .i{width:18px;height:18px;opacity:.85}
.hero-more{font-size:14.5px;color:#C5D6E8;margin-top:2px}
.hero-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.hero-f span{font-size:15.5px;color:#D7E5F3}
.wbtn{background:#fff;color:#00213F;border:0;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap}

/* cards */
.rowcard{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-top:16px;width:100%;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.sq{width:52px;height:52px;border-radius:15px;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;flex:none}
.sq .i{width:24px;height:24px}
.rowcard b{display:block;font-size:17px;font-weight:600}
.rowcard small{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.rowcard > span:not(.sq){flex:1;min-width:0}
.rowcard .chev{color:var(--muted);width:18px;height:18px}
.h2{font-size:19px;font-weight:600;margin:30px 0 14px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.h2 button{background:none;border:0;font-size:14.5px;color:var(--tint-ink);font-weight:600;cursor:pointer;padding:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tile b{font-size:18px;font-weight:500;line-height:1.2;letter-spacing:-.01em}
.tile small{display:block;font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
.hs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 14px var(--gl)}
.hs > *{flex:0 0 200px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pc .art{aspect-ratio:4/3;max-width:100%;border-radius:16px;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;position:relative}
.pc .art .i{width:46px;height:46px}
.pc .tag{position:absolute;left:8px;top:8px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pc .nm{font-size:15px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pc .pr{font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pc .pr small{font-size:12.5px;font-weight:500;color:var(--muted)}
.pc .px{font-size:13px;color:var(--ok);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}

/* page header */
.ph{position:sticky;top:var(--st);z-index:20;background:linear-gradient(var(--bg-top),rgba(0,0,0,0)) , transparent;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ph .w{display:flex;align-items:center;gap:12px;min-height:66px}
.ph h1{flex:1;margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.rb .i{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 18px;height:54px;box-shadow:var(--shadow);flex:1}
.search input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--f);color:var(--ink);outline:none}
.search .i{color:var(--muted)}
.count{font-size:14px;color:var(--muted);margin:14px 0 12px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .sq{width:64px;height:64px;border-radius:20px}

/* product */
.pd-art{margin-top:6px;border-radius:30px;background:radial-gradient(90% 90% at 30% 20%,var(--card),var(--tint));aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;color:var(--tint-ink);border:1px solid var(--line)}
.pd-art .i{width:84px;height:84px}
.pd-brand{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:18px}
.pd-name{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.pd-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.pd-price b{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pd-price span{color:var(--muted);font-size:15px}
.pd-pix{color:var(--ok);font-weight:600;font-size:14.5px;margin-top:2px}
.lbl{font-size:14.5px;font-weight:600;margin:22px 0 10px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer;width:100%}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.opt[aria-checked="true"]{border-color:var(--navy-2);box-shadow:0 0 0 3px var(--tint)}
.opt[aria-checked="true"] .rd{border-color:var(--navy-2);background:var(--navy-2)}
.opt[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.opt > span:not(.rd):not(.sq):not(.amt){flex:1;min-width:0}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.opt .amt{font-weight:700;font-size:15.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.opt .sq{width:44px;height:44px;border-radius:13px}
.note{border-radius:18px;padding:13px 16px;font-size:14.5px;font-weight:500;margin-top:12px;display:flex;gap:10px;align-items:flex-start}
.note .i{width:18px;height:18px;margin-top:1px}
.note.w2{background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.specs{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 18px}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs div:last-child{border-bottom:0}
.specs dt{color:var(--muted)}
.specs dd{margin:0;text-align:right;font-weight:500}

/* bottom action bar */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + var(--sb))}
.actbar .w{display:flex;gap:12px;align-items:center}
.stp{display:flex;align-items:center;background:var(--tint);border-radius:999px;height:54px;color:var(--tint-ink)}
.stp button{width:46px;height:100%;border:0;background:none;font-size:22px;cursor:pointer;color:inherit}
.stp span{min-width:22px;text-align:center;font-weight:700;font-size:17px}
.stp.sm{height:38px}.stp.sm button{width:36px;font-size:18px}.stp.sm span{font-size:15px}
.cta{flex:1;height:56px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--navy-2),var(--navy));color:#fff;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 26px -14px rgba(0,33,63,.8)}
.cta.or{background:var(--orange);box-shadow:0 14px 26px -14px rgba(242,138,38,.9)}
.cta.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}

/* cart */
.ci{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.ci .sq{width:64px;height:64px;border-radius:18px}
.ci .sq .i{width:30px;height:30px}
.ci > div{flex:1;min-width:0}
.ci .nm{font-size:15.5px;font-weight:600;line-height:1.3}
.ci .vr{font-size:13.5px;color:var(--muted)}
.ci .bt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.ci > .pr{flex:none}
.ci .pr{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.sum{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;font-size:15.5px;margin-top:6px}
.sum div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum div span:first-child{color:var(--muted)}
.sum .d,.sum .d span:first-child{color:var(--ok);font-weight:600}
.sum .t{border-top:1px solid var(--line);padding-top:12px;margin-top:3px;font-size:22px;font-weight:700}
.sum .t span:first-child{color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;font-size:15px;margin-top:10px}
.box small{display:block;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:9px 20px;font-size:15px;font-weight:600;cursor:pointer;color:var(--tint-ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* pix + track */
.pixc{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:var(--shadow);margin-top:6px}
.qr{background:#fff;border-radius:22px;padding:14px;border:1px solid var(--line)}
.qr canvas{width:200px;height:200px;image-rendering:pixelated;display:block}
.timer{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.big{font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.code{font:500 11.5px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all;background:var(--tint);border-radius:16px;padding:12px;width:100%;user-select:all}
.tl{list-style:none;margin:0;padding:6px 18px;background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:16px}
.tl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:12px 0;position:relative}
.tl li::before{content:"";position:absolute;left:13px;top:38px;bottom:-12px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.on::before{background:var(--ok)}
.tl .dt{width:28px;height:28px;border-radius:50%;background:var(--tint);display:grid;place-items:center;position:relative;z-index:1}
.tl li.on .dt{background:var(--ok);color:#fff}
.tl li.now .dt{background:var(--orange);box-shadow:0 0 0 6px rgba(242,138,38,.22)}
.tl .dt .i{width:14px;height:14px}
.tl b{font-size:15.5px;font-weight:600;display:block}
.tl small{font-size:13.5px;color:var(--muted)}
.orow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:12px;width:100%;text-align:left;cursor:pointer}
.orow > span{flex:1;min-width:0}
.orow b{display:block;font-weight:600}
.orow small{color:var(--muted);font-size:13.5px}
.st{font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap}
.st.a{background:var(--warn-bg);color:var(--warn)}.st.b{background:var(--ok-bg);color:var(--ok)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .w{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:76px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;padding:10px 0 12px}
.tab .i{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--tint-ink);font-weight:600}
.fab{justify-self:center;align-self:start;margin-top:-30px;width:72px;height:72px;border-radius:50%;border:5px solid var(--card);background:linear-gradient(145deg,var(--navy-2),var(--navy));color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:0 14px 24px -10px rgba(0,33,63,.7)}
.fab .i{width:28px;height:28px}
.fab .dotn{top:-4px;right:-4px;border-color:var(--card)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:28px 28px 0 0;max-height:calc(100% - var(--st) - 30px);overflow-y:auto;padding-top:10px;padding-bottom:calc(24px + var(--sb));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
.sheet p{color:var(--muted);margin:0 0 14px;font-size:15px}
.sheet .tel{font-size:26px;font-weight:700;user-select:all;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.sheet .acts{display:flex;gap:10px}
.sheet .acts a{flex:1}
.notes{display:flex;flex-direction:column;gap:26px;padding-top:6px}
.notes h2{font-size:20px;font-weight:600;margin:0 0 10px}
.notes .lede{color:var(--muted);margin:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.feat h3{font-size:16px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.feat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.feat li span{color:var(--muted)}
.phase{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--orange);color:#fff}
.phase.two{background:var(--tint);color:var(--tint-ink)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 16px}
.stack{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.stack th,.stack td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.stack tr:last-child td{border-bottom:0}
.stack th{font-size:12px;color:var(--muted);font-weight:600}
.stack td:first-child{font-weight:600;white-space:nowrap}
.stack td:last-child{color:var(--muted)}
.next{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;border-radius:999px;padding:12px 18px;font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:var(--shadow)}
.toast .i{width:16px;height:16px;color:var(--orange)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<template id="notes-src"><section>
      <h2>O que o app faz</h2>
      <div class="cols">
        <div class="feat"><h3><span class="phase">Versão 1</span> Comprar</h3><ul>
          <li>Catálogo por categoria: solda, gases, elétricas, fixação, abrasivos, EPI, ferragens e manuais</li>
          <li>Busca por nome, código ou medida <span>(ex.: “M8”, “6013”, “4.1/2”)</span></li>
          <li>Venda na unidade certa: kg, cento, caixa, rolo, par, recarga</li>
          <li>Gás com opção de recarga (troca do casco) ou cilindro novo</li>
          <li>Estoque da loja visível no produto</li></ul></div>
        <div class="feat"><h3><span class="phase">Versão 1</span> Pagar e receber</h3><ul>
          <li>Pix com desconto, cartão em até 10x e boleto para CNPJ</li>
          <li>Moto em até 3 h, caminhonete agendada para cilindros e peso, ou retirada no balcão</li>
          <li>CPF ou CNPJ com nota fiscal automática</li>
          <li>Acompanhamento do pedido com etapas e aviso no celular</li>
          <li>Painel da loja: pedidos, estoque, preços e entregadores</li></ul></div>
        <div class="feat"><h3><span class="phase two">Depois</span> Fidelizar</h3><ul>
          <li>“Compre de novo” e listas salvas por obra</li>
          <li>Orçamento enviando foto ou lista de materiais</li>
          <li>Conta empresa com vários compradores e faturamento</li>
          <li>Lembrete de recarga de gás pelo consumo médio</li>
          <li>Cupons e programa de pontos</li></ul></div>
      </div>
    </section>
<section>
      <h2>Stack sugerida</h2>
      <div class="tw"><table class="stack">
        <thead><tr><th>Parte</th><th>Escolha</th><th>Por quê</th></tr></thead>
        <tbody>
          <tr><td>App do cliente</td><td>React Native com Expo</td><td>Um código para Android e iPhone, publicação nas lojas simplificada</td></tr>
          <tr><td>Painel da loja</td><td>Next.js (web)</td><td>Balcão e gerente usam no computador, sem instalar nada</td></tr>
          <tr><td>Backend e banco</td><td>Supabase (Postgres)</td><td>Login, banco, fotos dos produtos e tempo real para o rastreio</td></tr>
          <tr><td>Pagamentos</td><td>Mercado Pago ou Asaas</td><td>Pix, cartão parcelado e boleto numa só integração</td></tr>
          <tr><td>Estoque e NF-e</td><td>Bling ou Tiny (ERP)</td><td>Se a loja já usa um ERP, o app lê estoque e emite nota por ele</td></tr>
          <tr><td>Entrega</td><td>App do entregador + Google Maps</td><td>Frota própria com rota e localização; Lalamove como reforço</td></tr>
          <tr><td>Avisos</td><td>Expo Push + WhatsApp</td><td>“Pagamento aprovado”, “saiu para entrega” e “entregue”</td></tr>
        </tbody></table></div>
    </section>
<section>
      <h2>Próximos passos</h2>
      <ol class="next">
        <li>Incluir a parte de locação: cilindros e máquinas para alugar, com prazo e caução.</li>
        <li>Levantar o catálogo inicial (uns 200 itens mais vendidos) com fotos e unidades de venda.</li>
        <li>Definir área e preço de entrega: raio da moto, dias da caminhonete, regra para cilindros.</li>
        <li>Escolher o meio de pagamento e abrir a conta da loja nele.</li>
        <li>Construir a versão 1 e testar com 10 clientes da loja antes de publicar.</li>
      </ol>
    </section></template>

      <div class="lbl">Nota fiscal</div><div class="seg"><button data-doc="cpf" aria-pressed="${S.doc==='cpf'}">CPF</button><button data-doc="cnpj" aria-pressed="${S.doc==='cnpj'}">CNPJ</button></div>
      <div class="box">${S.doc==='cnpj'?'12.345.678/0001-90 · Serralheria Silva':'123.456.789-00 · Marcos Silva'}</div>
      <div class="lbl">Resumo</div><div class="sum"><div><span>Produtos</span><span>${brl(t.sub)}</span></div><div><span>Entrega</span><span>${t.fee?brl(t.fee):'Grátis'}</span></div>${t.disc?`<div class="d"><span>Desconto Pix</span><span>−${brl(t.disc)}</span></div>`:''}<div class="t"><span>Total</span><span>${brl(t.total)}</span></div></div></div>
    <div class="actbar"><div class="w"><button class="cta" data-place>${S.pay==='pix'?'Gerar Pix':S.pay==='card'?'Pagar com cartão':'Gerar boleto'} · ${brl(t.total)}</button></div></div>`;
  },
  pix(){
    const t=totals();
    return ph('Pagamento Pix')+`<div class="w"><div class="pixc"><span class="timer">Pague em <span id="timer">14:59</span></span>
      <div class="qr"><canvas id="qr" width="29" height="29" aria-label="QR Code Pix de exemplo"></canvas></div>
      <div><div style="color:var(--muted);font-size:14.5px">Pedido #${S.lastOrder||S.orderNo}</div><div class="big">${brl(t.total)}</div></div>
      <div class="code" id="pixcode">00020126580014BR.GOV.BCB.PIX0136exemplo-dbc-${S.lastOrder||S.orderNo}52040000530398654${t.total.toFixed(2)}5802BR5911DBC EXEMPLO6007PIEDADE6304A1B2</div>
      <button class="cta ghost" data-copy style="width:100%;flex:none">Copiar código Pix</button>
      <div style="color:var(--muted);font-size:14px">Abra o app do banco, escolha Pix e leia o QR Code ou cole o código.</div></div></div>
    <div class="actbar"><div class="w"><button class="cta or" data-paid>Simular pagamento aprovado</button></div></div>`;
  },
  track(){
    const st=[['Pedido recebido','Hoje, 14:02',1],['Pagamento aprovado','Pix · 14:04',1],['Separado no estoque','Conferido por Jéssica · 14:21',1],['Saiu para entrega','Moto com Rogério · 14:38','now'],['Entregue','Previsto até 15:10',0]];
    return ph('Pedido #'+S.orderNo,`<span class="st a">A caminho</span>`)+`<div class="w">
      <section class="hero" style="margin-top:6px"><div class="hero-h"><span>Chega em cerca de</span><span class="pill-t">Moto</span></div>
        <div style="font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1">18 min</div>
        <div class="prow" style="cursor:default"><span>Rua das Indústrias, 450 · galpão 3</span></div>
        <div class="hero-f"><span>Código de entrega: 7314</span><a class="wbtn" href="tel:+551533442737">Falar com a loja</a></div></section>
      <ol class="tl">${st.map(s=>`<li class="${s[2]===1?'on':s[2]==='now'?'now':''}"><span class="dt">${s[2]===1?svg('check',3):''}</span><span><b>${s[0]}</b><small>${s[1]}</small></span></li>`).join('')}</ol></div>`;
  },
  orders(){
    const ic={moto:'moto',truck:'truck',pickup:'store'};
    return `<div class="w"><section class="top"><h1 class="hello">Pedidos</h1></section>
      ${ORDERS_().map(o=>`<button class="orow" data-order="${o.no}"><span class="sq">${svg(ic[o.ship],1.7)}</span><span><b>#${o.no} · ${o.date}</b><small>${oSummary(o)} · ${brl(oTot(o).total)}</small></span><span class="st ${o.status==='go'?'a':'b'}">${o.label}</span></button>`).join('')}</div>`;
  },
  order(){
    const o=ORD(S.order), t=oTot(o), live=o.status==='go';
    return ph('Pedido #'+o.no,`<span class="st ${live?'a':'b'}">${o.label}</span>`)+`<div class="w">
      <section class="hero" style="margin-top:6px"><div class="hero-h"><span>${o.date}</span><span class="pill-t">${SHIP_L[o.ship]}</span></div>
        <div style="font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1">${brl(t.total)}</div>
        <div class="prow" style="cursor:default"><span>${payL(o,t)}</span></div>
        <div class="hero-f"><span>${o.items.length} produtos</span>${live?`<button class="wbtn" data-go="track">Acompanhar</button>`:`<button class="wbtn" data-reorder="${o.no}">Pedir de novo</button>`}</div></section>
      <div class="lbl">Itens</div>
      ${o.items.map(([id,v,q,pr])=>{const p=prodAny(id),x=pr!=null?Object.assign({},vr(p,v),{p:pr}):vr(p,v);return `<div class="ci"><span class="sq" style="position:relative;overflow:hidden">${p.photo?`<img src="${p.photo}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit">`:svg(catOf(p).icon,1.5)}</span><div><div class="nm">${p.name}</div><div class="vr">${x.l} · ${q} ${p.unit} × ${brl(x.p)}</div></div><span class="pr" style="font-weight:700;font-variant-numeric:tabular-nums">${brl(x.p*q)}</span></div>`}).join('')}
      <div class="sum"><div><span>Produtos</span><span>${brl(t.sub)}</span></div><div><span>Entrega</span><span>${t.fee?brl(t.fee):'Grátis'}</span></div>${t.disc?`<div class="d"><span>Desconto Pix</span><span>−${brl(t.disc)}</span></div>`:''}<div class="t"><span>Total</span><span>${brl(t.total)}</span></div></div>
      ${codeBlock(o)}${retBlock(o)}<div class="lbl">${o.ship==='pickup'?'Retirada':'Entrega'}</div>
      <div class="box" style="margin-top:0">${o.ship==='pickup'?'DBC Gases e Locações<small>Rua Vinte de Maio, 320 · Bairro dos Cotianos · Piedade - SP</small>':'Rua das Indústrias, 450, galpão 3 · Distrito Industrial, Piedade - SP<small>Recebe: Marcos · (15) 9 8765-4321</small>'}</div>
      <div class="lbl">Andamento</div>
      <ol class="tl" style="margin-top:0">${o.steps.map(s=>`<li class="${s[2]===1?'on':s[2]==='now'?'now':''}"><span class="dt">${s[2]===1?svg('check',3):''}</span><span><b>${s[0]}</b><small>${s[1]}</small></span></li>`).join('')}</ol>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="cta" style="min-width:150px" data-reorder="${o.no}">Pedir de novo</button><a class="cta ghost" style="min-width:150px" href="tel:+551533442737">${svg('phone',2)}Falar com a loja</a></div></div>`;
  },
  account(){
    const row=(i,b,s,attr='')=>`<button class="rowcard" style="margin-top:12px;box-shadow:none" ${attr}><span class="sq">${svg(i,1.7)}</span><span><b>${b}</b><small>${s}</small></span>${svg('chev',2).replace('class="i"','class="i chev"')}</button>`;
    return `<div class="w"><section class="top"><h1 class="hello">Perfil</h1></section>
      ${row('user','Marcos Silva','Serralheria Silva · cliente desde 2023')}
      ${row('pin','Endereços','2 endereços salvos')}
      ${row('building','Dados da empresa','CNPJ 12.345.678/0001-90')}
      ${row('store','DBC Gases e Locações','Rua Vinte de Maio, 320 · (15) 3344-2737','data-layer="store"')}
      ${row('info','Sobre este esboço','Funcionalidades, stack e próximos passos','data-layer="notes"')}</div>`;
  },
  _sb(){
    const q=norm(S.q.trim());
    if(!q) return `<div class="lbl">Buscas frequentes</div><div class="chips" style="flex-wrap:wrap">${['6013','disco 4.1/2','M8','rebite','Makita','C25','luva'].map(s=>`<button class="chip" data-qs="${s}">${s}</button>`).join('')}</div>
      <h2 class="h2">Departamentos</h2><div class="tiles">${CATS.map(c=>`<button class="tile" data-cat="${c.id}"><span class="sq">${svg(c.icon,1.7)}</span><span><b>${c.name}</b></span></button>`).join('')}</div>`;
    const res=P.filter(p=>norm(p.name+' '+p.sku+' '+p.sub+' '+p.vars.map(v=>v.l).join(' ')).includes(q));
    return `<div class="count">${res.length} ${res.length===1?'resultado':'resultados'} para “${S.q.trim()}”</div>${res.length?`<div class="grid">${res.map(pc).join('')}</div>`:`<div class="empty"><span class="sq">${svg('search',1.7)}</span>Nada encontrado. Tente pelo código ou pela medida.</div>`}`;
  }
};
const searchBody=()=>R._sb();
const LAYERS = {
  store:()=>`<div class="w"><div class="grab"></div><h2>DBC Gases e Locações</h2><p>Rua Vinte de Maio, nº 320 · Bairro dos Cotianos<br>Piedade - SP · CEP 18170-000</p><div class="tel">${STORE_TEL}</div>
    <div class="acts"><a class="cta or" href="tel:+551533442737">${svg('phone',2)}Ligar</a><a class="cta ghost" href="${MAPS}" target="_blank" rel="noopener">${svg('pin',2)}Como chegar</a></div></div>`,
  notes:()=>`<div class="w"><div class="grab"></div><div class="notes"><div><h2>Sobre este esboço</h2><p class="lede">Versão 2 do app da DBC Gases e Locações, com visual mais leve e arredondado. As funções são as mesmas da versão 1.</p></div>${$('notes-src').innerHTML}</div></div>`
};
const TABS=[{id:'home',l:'Início',i:'home'},{id:'orders',l:'Pedidos',i:'box'},{id:'fab'},{id:'search',l:'Buscar',i:'search'},{id:'account',l:'Perfil',i:'user'}];
const NO_NAV=['prod','checkout','pix'];
const tabOf=s=>({home:'home',orders:'orders',order:'orders',track:'orders',search:'search',cat:'search',account:'account',cart:'fab'})[s];

let timerId;
function render(top=true){
  $('view').innerHTML=R[S.screen]();
  const nav=$('nav'); nav.hidden=NO_NAV.includes(S.screen);
  const cur=tabOf(S.screen);
  nav.innerHTML=`<div class="w">${TABS.map(t=>t.id==='fab'?`<button class="fab" data-tab="cart" aria-label="Carrinho">${svg('cart',2)}${S.cart.length?`<span class="dotn">${cartQty()}</span>`:''}</button>`:`<button class="tab" data-tab="${t.id}" aria-current="${t.id===cur}">${svg(t.i,1.7)}${t.l}</button>`).join('')}</div>`;
  if(top) window.scrollTo(0,0);
  clearInterval(timerId);
  if(S.screen==='pix'){drawQR();let s=899;timerId=setInterval(()=>{const el=$('timer');if(!el){clearInterval(timerId);return}s=Math.max(0,s-1);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
  const q=$('q'); if(q) q.addEventListener('input',()=>{S.q=q.value;$('sres').innerHTML=searchBody()});
}
function renderLayer(){
  const el=$('layer');
  if(!S.layer){el.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  el.innerHTML=`<div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true">${LAYERS[S.layer]()}</section>`;
}
function drawQR(){
  const c=$('qr'); if(!c) return; const x=c.getContext('2d'), n=29;
  x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#00213F';
  let seed=Number(S.orderNo); const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const finder=(a,b)=>(a<8&&b<8)||(a>=n-8&&b<8)||(a<8&&b>=n-8);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(!finder(i,j)&&rnd()>.52) x.fillRect(i,j,1,1)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#00213F';x.fillRect(a+2,b+2,3,3)});
}
function go(s){ if(S.screen!==s) S.hist.push(S.screen); S.screen=s; render(); }
function addToCart(id,v,q){const ex=S.cart.find(c=>c.id===id&&c.v===v);ex?ex.q+=q:S.cart.push({id,v,q})}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,.scrim'); if(!b) return;
  const d=b.dataset;
  if('close' in d){ S.layer=null; return renderLayer(); }
  if('layer' in d){ S.layer=d.layer; return renderLayer(); }
  if('tab' in d){ S.hist=[]; S.screen=d.tab; return render(); }
  if('back' in d){ S.screen=S.hist.pop()||'home'; return render(); }
  if('cat' in d){ S.cat=d.cat; return go('cat'); }
  if('cat2' in d){ S.cat=d.cat2; return render(false); }
  if('qs' in d){ S.q=d.qs; return render(false); }
  if('repeat' in d){ DEFAULT_CART().forEach(c=>addToCart(c.id,c.v,c.q)); toast('Último pedido no carrinho'); S.hist=[]; S.screen='cart'; return render(); }
  if('order' in d){ S.order=d.order; return go('order'); }
  if('reorder' in d){ ORD(d.reorder).items.forEach(([id,v,q])=>addToCart(id,v,q)); toast('Itens do pedido no carrinho'); S.hist=[]; S.screen='cart'; return render(); }
  if('p' in d){ S.prod=d.p; S.variant=0; S.qty=1; return go('prod'); }
  if('var' in d){ S.variant=+d.var; return render(false); }
  if('qty' in d){ S.qty=Math.max(1,S.qty+ +d.qty); return render(false); }
  if('add' in d){ addToCart(S.prod,S.variant,S.qty); toast('Adicionado ao carrinho'); S.screen=S.hist.pop()||'home'; return render(); }
  if('cq' in d){ const c=S.cart[+d.cq]; c.q+= +d.d; if(c.q<1) S.cart.splice(+d.cq,1); return render(false); }
  if('ship' in d){ if(d.ship==='moto'&&hasGas()) return; S.ship=d.ship; return render(false); }
  if('pay' in d){ S.pay=d.pay; return render(false); }
  if('doc' in d){ S.doc=d.doc; return render(false); }
  if('place' in d){ const o=placeOrder(S.pay==='card',S.doc); S.lastOrder=o?o.no:null; if(S.pay==='pix') return go('pix'); toast(S.pay==='card'?'Pagamento aprovado':'Boleto gerado'); if(o){S.cart=[];S.order=o.no;S.hist=[];S.screen='order';return render()} S.hist=[]; S.screen='track'; return render(); }
  if('paid' in d){ if(S.lastOrder&&window.DBCStore){DBCStore.setStatus(S.lastOrder,1);S.cart=[];S.order=S.lastOrder;S.lastOrder=null;S.hist=[];S.screen='order';toast('Pagamento aprovado');return render()} S.hist=[];S.screen='track';return render(); }
  if('copy' in d){ const code=$('pixcode').textContent; try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado'),selectCode)}catch(_){selectCode()} return; }
  if(d.go){ if(d.go==='track'){S.hist=[];S.screen='track';return render()} return go(d.go); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.layer){S.layer=null;renderLayer()} });
function selectCode(){const el=$('pixcode');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
syncStore(); if(window.DBCStore) DBCStore.onChange(()=>{syncStore(); render(false);});
render();
})();
</script>

</body>
