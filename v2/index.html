<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: catálogo técnico de balcão. Cabeçalho marinho fixo com carrinho no topo, faixa de departamentos, lista em linhas (não cards), produto e carrinho em painéis que sobem, fechamento em etapas numeradas com cupom. */
:root{
  --paper:#F5F7FA; --row:#FFFFFF; --ink:#0B1B2E; --muted:#5A6B7E; --rule:#CDD6E0; --rule-2:#E4E9EF;
  --navy:#00213F; --navy-2:#0A2E52; --orange:#F28A26; --orange-ink:#00213F; --blue:#1673AD; --ok:#13804A; --ok-bg:#E1F3E8; --warn:#9A5600; --warn-bg:#FFF0DA;
  --scrim:rgba(0,16,32,.55);
  --f-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#08121D; --row:#0E1B2A; --ink:#E7EEF6; --muted:#93A5B9; --rule:#22364D; --rule-2:#182A3D;
  --navy:#001428; --navy-2:#062440; --orange:#F5963A; --blue:#5DB4E6; --ok:#4CC683; --ok-bg:#0F2A1C; --warn:#F2B35A; --warn-bg:#2A1F0D; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#08121D; --row:#0E1B2A; --ink:#E7EEF6; --muted:#93A5B9; --rule:#22364D; --rule-2:#182A3D;
  --navy:#001428; --navy-2:#062440; --orange:#F5963A; --blue:#5DB4E6; --ok:#4CC683; --ok-bg:#0F2A1C; --warn:#F2B35A; --warn-bg:#2A1F0D; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--st);z-index:40;background:var(--navy)}
button{font-family:inherit;color:inherit}
a{color:inherit}
.w{max-width:960px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
svg.i{width:20px;height:20px;flex:none}
.mono{font-family:var(--f-mono)}
.cond{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.02em}

/* ---------- header ---------- */
.hdr{position:sticky;top:var(--st);z-index:30;background:var(--navy);color:#fff}
.hdr .w{display:flex;align-items:center;gap:10px;min-height:62px}
.hb{width:42px;height:42px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:2px;flex:none}
.brand{flex:1;display:flex;align-items:center;min-width:0}
.brand svg{height:36px;width:auto;display:block}
.cartbtn{height:42px;display:flex;align-items:stretch;border:0;cursor:pointer;padding:0;border-radius:2px;overflow:hidden;flex:none}
.cartbtn .n{background:var(--orange);color:var(--orange-ink);display:flex;align-items:center;gap:6px;padding:0 10px;font:800 18px var(--f-cond)}
.cartbtn .v{background:#fff;color:#00213F;display:flex;align-items:center;padding:0 10px;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.strip{background:var(--navy-2);color:#A8BCD1;font:500 11.5px var(--f-mono)}
.strip .w{display:flex;gap:6px 14px;flex-wrap:wrap;padding-block:6px;align-items:center}
.strip a{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.strip svg{width:12px;height:12px;color:var(--orange)}
.strip .ph{color:#fff;user-select:all}

.depts{position:sticky;top:calc(var(--st) + 62px);z-index:25;background:var(--row);border-bottom:1px solid var(--rule)}
.depts .w{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-left:0;padding-right:0}
.dept{flex:none;border:0;background:none;padding:12px 14px 10px;font:700 15px var(--f-cond);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:baseline}
.dept small{font:500 11px var(--f-mono);color:var(--muted)}
.dept[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.dept:first-child{margin-left:var(--gl)}

/* ---------- search + quick ---------- */
.find{padding-block:16px 6px}
.findbox{display:flex;align-items:center;border:1.5px solid var(--ink);background:var(--row);height:50px;border-radius:2px}
.findbox .i{margin:0 10px 0 14px;color:var(--muted)}
.findbox input{flex:1;min-width:0;border:0;background:transparent;font:500 15px var(--f-mono);color:var(--ink);outline:none;height:100%}
.findbox button{border:0;border-left:1px solid var(--rule);background:transparent;height:100%;padding:0 14px;font:700 14px var(--f-cond);text-transform:uppercase;cursor:pointer;color:var(--muted)}
.hint{font:500 11.5px var(--f-mono);color:var(--muted);margin-top:8px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);background:var(--row);margin-top:14px}
.qt{border:0;background:none;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--rule);min-height:108px;text-decoration:none}
.qt:last-child{border-right:0}
.qt .i{width:24px;height:24px;color:var(--blue)}
.qt b{font:800 17px/1.05 var(--f-cond);text-transform:uppercase;letter-spacing:.02em}
.qt span{font-size:12px;color:var(--muted);line-height:1.3}
.qt.hot{background:var(--orange);color:var(--orange-ink)}
.qt.hot .i,.qt.hot span{color:var(--orange-ink)}

/* ---------- catalog rows ---------- */
.group{margin-top:22px}
.gh{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.gh .i{color:var(--orange);width:22px;height:22px}
.gh h2{font:800 22px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.03em;margin:0;flex:1}
.gh small{font:500 11.5px var(--f-mono);color:var(--muted)}
.rows{background:var(--row);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.r{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--rule);cursor:pointer;width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left}
.r:hover{background:var(--rule-2)}
.ico{width:52px;height:52px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink);background:var(--paper)}
.ico .i{width:26px;height:26px}
.sku{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.02em}
.nm{font-weight:600;font-size:14.5px;line-height:1.3;margin:1px 0 3px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lab{font:600 10.5px var(--f-mono);padding:1px 6px;border:1px solid var(--rule);color:var(--muted);text-transform:uppercase}
.lab.or{border-color:var(--orange);color:var(--warn);background:var(--warn-bg)}
.pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pv{font:700 20px/1 var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.pu{font:500 10.5px var(--f-mono);color:var(--muted)}
.pp{font:600 11px var(--f-mono);color:var(--ok);white-space:nowrap}
.add{margin-top:4px;width:34px;height:30px;border:0;background:var(--ink);color:var(--paper);font:700 18px var(--f-sans);display:grid;place-items:center;cursor:pointer;border-radius:2px}
.add.in{width:auto;padding:0 8px;background:var(--orange);color:var(--orange-ink);font:800 14px var(--f-cond)}
.none{padding:36px 12px;text-align:center;color:var(--muted);font:500 13px var(--f-mono);border:1px dashed var(--rule);margin-top:16px}
.endnote{font:500 11px var(--f-mono);color:var(--muted);text-align:center;padding:28px 0 12px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--row);max-height:calc(100% - var(--st) - 40px);display:flex;flex-direction:column;border-top:4px solid var(--orange);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .w{width:100%}
.sh-h{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--rule)}
.sh-h h3{flex:1;margin:0;font:800 20px var(--f-cond);text-transform:uppercase;letter-spacing:.03em}
.x{width:38px;height:38px;border:1px solid var(--rule);background:none;display:grid;place-items:center;cursor:pointer;border-radius:2px}
.sh-b{overflow-y:auto;flex:1}
.sh-f{border-top:1px solid var(--rule);padding-top:12px;padding-bottom:calc(12px + var(--sb))}
.sh-f .w{display:flex;gap:10px;align-items:center}

.pd-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding-block:16px;align-items:start}
.pd-top .ico{width:84px;height:84px}
.pd-top .ico .i{width:42px;height:42px}
.pd-name{font:800 26px/1.02 var(--f-cond);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
.vt{width:100%;border-collapse:collapse;margin-top:4px}
.vt td{padding:0;border-bottom:1px solid var(--rule)}
.vr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:12px 0;cursor:pointer;text-align:left}
.vr .rd{width:18px;height:18px;border:2px solid var(--rule);border-radius:50%;display:grid;place-items:center}
.vr[aria-checked="true"] .rd{border-color:var(--orange)}
.vr[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
.vr b{font-weight:600;display:block}
.vr small{color:var(--muted);font-size:12.5px}
.vr .vp{font:700 18px var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
.flag{border-left:3px solid var(--orange);background:var(--warn-bg);color:var(--warn);padding:10px 12px;font-size:13px;font-weight:500;margin-top:14px}
.flag.ok{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);border-top:1px solid var(--rule);margin:0 0 18px}
.dl dt,.dl dd{margin:0;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.dl dt{color:var(--muted);font:500 12px var(--f-mono);padding-top:10px}
.stp{display:flex;align-items:center;border:1.5px solid var(--ink);height:48px;border-radius:2px}
.stp button{width:40px;height:100%;border:0;background:none;font-size:20px;cursor:pointer}
.stp span{min-width:28px;text-align:center;font:600 15px var(--f-mono)}
.stp.sm{height:32px;border-width:1px}.stp.sm button{width:30px;font-size:16px}.stp.sm span{min-width:22px;font-size:13px}
.go{flex:1;height:52px;border:0;background:var(--orange);color:var(--orange-ink);font:800 19px var(--f-cond);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:10px}
.go.ink{background:var(--ink);color:var(--paper)}
.go.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.go .mono{font:600 14px var(--f-mono);opacity:.85}

.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.cl .nm{margin:0}
.cl .tot{font:700 17px var(--f-cond);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- checkout page ---------- */
.page-h{background:var(--row);border-bottom:1px solid var(--rule);position:sticky;top:calc(var(--st) + 62px);z-index:20}
.page-h .w{display:flex;align-items:center;gap:10px;min-height:54px}
.page-h h1{margin:0;font:800 22px var(--f-cond);text-transform:uppercase;letter-spacing:.03em;flex:1}
.back{height:36px;border:1px solid var(--rule);background:none;padding:0 10px;display:flex;gap:4px;align-items:center;font:700 14px var(--f-cond);text-transform:uppercase;cursor:pointer;border-radius:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:20px calc(40px + var(--sb))}
@media (min-width:860px){.layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.receipt-col{position:sticky;top:calc(var(--st) + 140px)}}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 12px;margin-bottom:22px}
.step .num{font:800 30px/1 var(--f-cond);color:var(--orange)}
.step h2{font:800 20px/1.1 var(--f-cond);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 10px}
.opts{border:1px solid var(--rule);background:var(--row)}
.op{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:13px 12px;cursor:pointer;text-align:left}
.op:last-child{border-bottom:0}
.op .rd{width:18px;height:18px;border:2px solid var(--rule);border-radius:50%;display:grid;place-items:center}
.op[aria-checked="true"]{background:var(--warn-bg)}
.op[aria-checked="true"] .rd{border-color:var(--orange)}
.op[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
.op[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.op .i{color:var(--blue)}
.op b{font-weight:600;display:block;font-size:14.5px}
.op small{color:var(--muted);font-size:12.5px;display:block;line-height:1.35}
.op .amt{font:600 13px var(--f-mono);white-space:nowrap}
.addr{border:1px solid var(--rule);border-top:0;background:var(--row);padding:10px 12px;font-size:13.5px}
.addr .sku{display:block;margin-bottom:2px}
.nf{display:flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;width:max-content;max-width:100%}
.nf button{border:0;background:none;padding:10px 16px;font:700 15px var(--f-cond);text-transform:uppercase;cursor:pointer}
.nf button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nfd{font:500 12.5px var(--f-mono);color:var(--muted);margin-top:8px}

.receipt{background:var(--row);border:1px solid var(--rule);padding:18px 16px;font-family:var(--f-mono);font-size:12.5px;position:relative}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--row) 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,var(--row) 0) 0 0/12px 8px;filter:drop-shadow(0 1px 0 var(--rule))}
.receipt h3{font:800 18px var(--f-cond);text-transform:uppercase;margin:0 0 2px;text-align:center;letter-spacing:.05em}
.receipt .ctr{text-align:center;color:var(--muted);font-size:11px;line-height:1.5}
.receipt hr{border:0;border-top:1px dashed var(--rule);margin:12px 0}
.rl{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.rl span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl.d{color:var(--ok)}
.rl.t{font:800 22px var(--f-cond);padding-top:6px}
.receipt .go{margin-top:14px;width:100%}

/* ---------- pix + orders ---------- */
.pixwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 40px}
@media (min-width:760px){.pixwrap{grid-template-columns:240px minmax(0,1fr);align-items:start}}
.qrbox{background:#fff;border:1px solid var(--rule);padding:14px;width:max-content;max-width:100%}
.qrbox canvas{width:210px;height:210px;image-rendering:pixelated;display:block;max-width:100%}
.big{font:800 40px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.code{font:500 11px var(--f-mono);color:var(--muted);word-break:break-all;background:var(--row);border:1px dashed var(--rule);padding:10px;user-select:all;margin:12px 0}
.timer{font:600 12px var(--f-mono);color:var(--warn)}
.track{background:var(--row);border:1px solid var(--rule);margin-top:16px}
.track-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px;border-bottom:1px solid var(--rule)}
.eta{font:800 44px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:14px 14px 4px}
.bar i{height:6px;background:var(--rule)}
.bar i.on{background:var(--ok)}
.bar i.now{background:var(--orange)}
.blabels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:0 14px 14px;font:500 10px var(--f-mono);color:var(--muted);text-transform:uppercase}
.blabels span.cur{color:var(--ink);font-weight:600}
.log{list-style:none;margin:0;padding:0 14px;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.log li:last-child{border-bottom:0}
.log time{font:500 12px var(--f-mono);color:var(--muted)}
.drv{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--rule)}
.drv .ico{width:44px;height:44px;font:800 18px var(--f-cond)}
.olist{border:1px solid var(--rule);background:var(--row);margin-top:16px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--rule);width:100%;background:none;text-align:left;cursor:pointer}
.orow:last-child{border-bottom:0}
.st{font:600 10.5px var(--f-mono);text-transform:uppercase;padding:2px 7px;border:1px solid currentColor}
.st.go2{color:var(--warn)}.st.ok{color:var(--ok)}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:51;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding-top:calc(var(--st) + 18px);padding-bottom:calc(18px + var(--sb));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;animation:slide .2s ease-out;overflow-y:auto}
@keyframes slide{from{transform:translateX(-30px);opacity:.5}to{transform:none;opacity:1}}
.drawer .brand svg{height:44px}
.nav{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid rgba(255,255,255,.15)}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.15);color:#fff;padding:14px 0;font:700 20px var(--f-cond);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-align:left}
.nav button .i{color:var(--orange)}
.nav button small{margin-left:auto;font:500 11px var(--f-mono);color:#A8BCD1}
.dstore{margin-top:auto;padding-top:24px;font-size:13px;color:#C3D2E2;line-height:1.5}
.dstore b{display:block;color:#fff;font:800 16px var(--f-cond);text-transform:uppercase;letter-spacing:.04em}
.dstore .ph{font:600 18px var(--f-mono);color:#fff;margin:6px 0 10px;user-select:all}
.dstore .acts{display:flex;gap:8px}
.dstore a{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font:800 15px var(--f-cond);text-transform:uppercase;border-radius:2px}
.dstore a.c1{background:var(--orange);color:#00213F}
.dstore a.c2{border:1px solid rgba(255,255,255,.3);color:#fff}
.dstore svg{width:16px;height:16px}

/* ---------- notes ---------- */
.notes{padding-block:22px 48px;display:flex;flex-direction:column;gap:28px;max-width:860px}
.notes h2{font:800 24px var(--f-cond);text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.notes .lede{font-size:16px;max-width:64ch;margin:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.feat h3{font:700 15px var(--f-sans);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.feat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.feat li span{color:var(--muted)}
.phase{font:600 10.5px var(--f-mono);text-transform:uppercase;padding:2px 7px;background:var(--orange);color:var(--orange-ink)}
.phase.two{background:var(--rule);color:var(--ink)}
.tw{overflow-x:auto}
.stack{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.stack th,.stack td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.stack th{font:600 11px var(--f-mono);text-transform:uppercase;color:var(--muted)}
.stack td:first-child{font-weight:600;white-space:nowrap}
.stack td:last-child{color:var(--muted)}
.next{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 72px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 14px;font:600 13px var(--f-mono);display:flex;gap:8px;align-items:center;white-space:nowrap;border-left:4px solid var(--orange)}
.toast .i{width:16px;height:16px;color:var(--orange)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.qt{padding:12px 10px;min-height:100px}.qt b{font-size:15.5px}}
</style>

<body>


<header class="hdr"><div class="w">
  <button class="hb" data-drawer aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="brand" id="brand"></div>
  <button class="cartbtn" data-cart aria-label="Abrir carrinho"><span class="n" id="cn"></span><span class="v" id="cv"></span></button>
</div></header>
<div class="strip"><div class="w" id="strip"></div></div>
<main id="view"></main>
<div id="layer"></div>
<template id="notes-src"><section>
      <h2>O que o app faz</h2>
      <div class="cols">
        <div class="feat"><h3><span class="phase">Versão 1</span> Comprar</h3><ul>
          <li>Catálogo por categoria: solda, gases, elétricas, fixação, abrasivos, EPI, ferragens e manuais</li>
          <li>Busca por nome, código ou medida <span>(ex.: “M8”, “6013”, “4.1/2”)</span></li>
          <li>Venda na unidade certa: kg, cento, caixa, rolo, par, recarga</li>
          <li>Gás com opção de recarga (troca do casco) ou cilindro novo</li>
          <li>Estoque da loja visível no produto</li></ul></div>
        <div class="feat"><h3><span class="phase">Versão 1</span> Pagar e receber</h3><ul>
          <li>Pix com desconto, cartão em até 10x e boleto para CNPJ</li>
          <li>Moto em até 3 h, caminhonete agendada para cilindros e peso, ou retirada no balcão</li>
          <li>CPF ou CNPJ com nota fiscal automática</li>
          <li>Acompanhamento do pedido com etapas e aviso no celular</li>
          <li>Painel da loja: pedidos, estoque, preços e entregadores</li></ul></div>
        <div class="feat"><h3><span class="phase two">Depois</span> Fidelizar</h3><ul>
          <li>“Compre de novo” e listas salvas por obra</li>
          <li>Orçamento enviando foto ou lista de materiais</li>
          <li>Conta empresa com vários compradores e faturamento</li>
          <li>Lembrete de recarga de gás pelo consumo médio</li>
          <li>Cupons e programa de pontos</li></ul></div>
      </div>
    </section>
<section>
      <h2>Stack sugerida</h2>
      <div class="tw"><table class="stack">
        <thead><tr><th>Parte</th><th>Escolha</th><th>Por quê</th></tr></thead>
        <tbody>
          <tr><td>App do cliente</td><td>React Native com Expo</td><td>Um código para Android e iPhone, publicação nas lojas simplificada</td></tr>
          <tr><td>Painel da loja</td><td>Next.js (web)</td><td>Balcão e gerente usam no computador, sem instalar nada</td></tr>
          <tr><td>Backend e banco</td><td>Supabase (Postgres)</td><td>Login, banco, fotos dos produtos e tempo real para o rastreio</td></tr>

      <span class="add${inCart?' in':''}" data-quick="${p.id}" role="button" aria-label="Adicionar">${inCart?inCart+' no carrinho':'+'}</span></span></button>`;
}

const V = {
  catalog(){
    const q=norm(S.q.trim());
    let items=P.filter(p=>S.dept==='all'||p.cat===S.dept);
    if(q) items=items.filter(p=>norm(p.name+' '+p.sku+' '+p.sub+' '+p.vars.map(v=>v.l).join(' ')).includes(q));
    const groups=CATS.map(c=>({c,items:items.filter(p=>p.cat===c.id)})).filter(g=>g.items.length);
    const counts=Object.fromEntries(CATS.map(c=>[c.id,P.filter(p=>p.cat===c.id).length]));
    return `<nav class="depts" aria-label="Departamentos"><div class="w">
      <button class="dept" data-dept="all" aria-pressed="${S.dept==='all'}">Tudo <small>${P.length}</small></button>
      ${CATS.map(c=>`<button class="dept" data-dept="${c.id}" aria-pressed="${S.dept===c.id}">${c.name} <small>${counts[c.id]}</small></button>`).join('')}</div></nav>
    <div class="w">
      <div class="find"><label class="findbox">${svg('search',2)}<input id="q" type="search" placeholder="Código, medida ou nome" value="${S.q.replace(/"/g,'&quot;')}" autocomplete="off">${S.q?'<button data-clear>Limpar</button>':''}</label>
        <div class="hint">ex.: M8 · 6013 · 4.1/2 · C25 · Makita</div></div>
      ${S.dept==='all'&&!q?`<div class="quick">
        <button class="qt hot" data-p="c25">${svg('cyl',1.8)}<b>Trocar cilindro</b><span>Recarga C25 com troca do casco</span></button>
        <button class="qt" data-repeat>${svg('repeat',1.8)}<b>Pedir de novo</b><span>Último pedido: 3 itens</span></button>
        <a class="qt" href="tel:+551533442737">${svg('phone',1.8)}<b>Falar com o balcão</b><span class="mono">(15) 3344-2737</span></a></div>`:''}
      <div id="list">${groups.length?groups.map(g=>`<section class="group"><div class="gh">${svg(g.c.icon,1.8)}<h2>${g.c.name}</h2><small>${g.items.length} ${g.items.length===1?'item':'itens'}</small></div>
        <div class="rows">${g.items.map(rowHTML).join('')}</div></section>`).join(''):`<div class="none">Nenhum item para “${S.q.trim()}”. Tente pelo código ou pela medida.</div>`}</div>
      <div class="endnote">Preços e produtos de exemplo · DBC Gases e Locações</div>
    </div>`;
  },
  checkout(){
    if(hasGas()&&S.ship==='moto') S.ship='truck';
    const t=totals(), gas=hasGas();
    const ship=[
      {id:'moto',i:'moto',b:'Moto, hoje em até 3 h',s:gas?'Indisponível: o pedido tem cilindro':'Até 15 kg · seg. a sáb., 7h às 17h',a:14.90,dis:gas},
      {id:'truck',i:'truck',b:'Caminhonete, agendada',s:'Amanhã, 8h às 12h · cilindros e peso',a:39.90},
      {id:'pickup',i:'store',b:'Retirar na loja',s:'Pronto em 30 min · Rua Vinte de Maio, 320',a:0}];
    const pay=[
      {id:'pix',i:'pixi',b:'Pix',s:'5% de desconto, aprovação na hora',a:'−'+brl(t.sub*.05)},
      {id:'card',i:'card',b:'Cartão de crédito',s:'Até 10x sem juros de '+brl((t.sub+t.fee)/10),a:''},
      {id:'boleto',i:'barcode',b:'Boleto',s:'Vence em 3 dias úteis',a:''}];
    return `<div class="page-h"><div class="w"><button class="back" data-home>${svg('back',2.2)}Catálogo</button><h1>Fechar pedido</h1></div></div>
    <div class="w layout"><div>
      <div class="step"><div class="num">01</div><div><h2>Entrega</h2>
        <div class="opts">${ship.map(o=>`<button class="op" role="radio" data-ship="${o.id}" aria-checked="${S.ship===o.id}" aria-disabled="${!!o.dis}"><span class="rd"></span>${svg(o.i)}<span><b>${o.b}</b><small>${o.s}</small></span><span class="amt">${o.a?brl(o.a):'grátis'}</span></button>`).join('')}</div>
        ${S.ship!=='pickup'?`<div class="addr"><span class="sku">ENTREGAR EM</span>Rua das Indústrias, 450, galpão 3 · Distrito Industrial, Piedade - SP<br><span class="sku">RECEBE: MARCOS · (15) 9 8765-4321</span></div>`:''}</div></div>
      <div class="step"><div class="num">02</div><div><h2>Pagamento</h2>
        <div class="opts">${pay.map(o=>`<button class="op" role="radio" data-pay="${o.id}" aria-checked="${S.pay===o.id}"><span class="rd"></span>${svg(o.i)}<span><b>${o.b}</b><small>${o.s}</small></span><span class="amt" style="color:var(--ok)">${o.a}</span></button>`).join('')}</div></div></div>
      <div class="step"><div class="num">03</div><div><h2>Nota fiscal</h2>
        <div class="nf"><button data-doc="cpf" aria-pressed="${S.doc==='cpf'}">CPF</button><button data-doc="cnpj" aria-pressed="${S.doc==='cnpj'}">CNPJ</button></div>
        <div class="nfd">${S.doc==='cnpj'?'12.345.678/0001-90 · Serralheria Silva':'123.456.789-00 · Marcos Silva'}</div></div></div>
    </div>
    <div class="receipt-col"><div class="receipt"><h3>DBC Gases e Locações</h3>
      <div class="ctr">Rua Vinte de Maio, 320 · Piedade - SP<br>(15) 3344-2737</div><hr>
      ${S.cart.map(c=>{const p=byId(c.id),v=p.vars[c.v];return `<div class="rl"><span>${c.q} ${p.unit} ${p.sku} ${v.l}</span><span>${brl(lineTotal(c))}</span></div>`}).join('')}
      <hr><div class="rl"><span>Produtos</span><span>${brl(t.sub)}</span></div>
      <div class="rl"><span>Entrega</span><span>${t.fee?brl(t.fee):'grátis'}</span></div>
      ${t.disc?`<div class="rl d"><span>Desconto Pix 5%</span><span>−${brl(t.disc)}</span></div>`:''}
      <hr><div class="rl t"><span>Total</span><span>${brl(t.total)}</span></div>
      <button class="go" data-place>${S.pay==='pix'?'Gerar Pix':S.pay==='card'?'Pagar com cartão':'Gerar boleto'}</button></div></div>
    </div>`;
  },
  pix(){
    const t=totals();
    return `<div class="page-h"><div class="w"><button class="back" data-view="checkout">${svg('back',2.2)}Voltar</button><h1>Pagamento Pix</h1></div></div>
    <div class="w pixwrap"><div class="qrbox"><canvas id="qr" width="29" height="29" aria-label="QR Code Pix de exemplo"></canvas></div>
      <div><div class="sku">PEDIDO #${S.orderNo} · <span class="timer">expira em <span id="timer">14:59</span></span></div>
        <div class="big" style="margin:6px 0 4px">${brl(t.total)}</div>
        <div style="font-size:14px;color:var(--muted)">Abra o app do banco, escolha Pix e leia o QR Code ou cole o código.</div>
        <div class="code" id="pixcode">00020126580014BR.GOV.BCB.PIX0136exemplo-dbc-${S.orderNo}52040000530398654${t.total.toFixed(2)}5802BR5911DBC EXEMPLO6007PIEDADE6304A1B2</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="go line" data-copy style="flex:1;min-width:180px">Copiar código</button><button class="go ink" data-view="orders" style="flex:1;min-width:180px">Simular pagamento</button></div></div></div>`;
  },
  orders(){
    const steps=['Recebido','Pago','Separado','A caminho','Entregue'], now=3;
    return `<div class="page-h"><div class="w"><button class="back" data-home>${svg('back',2.2)}Catálogo</button><h1>Meus pedidos</h1></div></div>
    <div class="w" style="padding-bottom:calc(40px + var(--sb))">
      <div class="track"><div class="track-h"><div><div class="sku">PEDIDO #${S.orderNo} · MOTO</div><div class="eta">18 min</div><div style="font-size:13px;color:var(--muted)">para chegar na Rua das Indústrias, 450</div></div><span class="st go2">A caminho</span></div>
        <div class="bar">${steps.map((s,i)=>`<i class="${i<now?'on':i===now?'now':''}"></i>`).join('')}</div>
        <div class="blabels">${steps.map((s,i)=>`<span class="${i===now?'cur':''}">${s}</span>`).join('')}</div>
        <ul class="log"><li><time>14:38</time><span>Saiu da loja com o entregador</span></li><li><time>14:21</time><span>Itens separados e conferidos por Jéssica</span></li><li><time>14:04</time><span>Pagamento Pix aprovado</span></li><li><time>14:02</time><span>Pedido recebido</span></li></ul>
        <div class="drv"><span class="ico">R</span><div style="flex:1"><b>Rogério</b><div class="sku">MOTO · ABC-1D23 · CÓDIGO DE ENTREGA 7314</div></div></div></div>
      <div class="olist">
        <button class="orow"><span class="sku">#4710</span><span>Recarga C25 · caminhonete<br><span class="sku">08/10</span></span><span class="st ok">Entregue</span></button>
        <button class="orow"><span class="sku">#4655</span><span>12 itens · retirada na loja<br><span class="sku">29/09</span></span><span class="st ok">Retirado</span></button></div>
    </div>`;
  },
  notes(){
    return `<div class="page-h"><div class="w"><button class="back" data-home>${svg('back',2.2)}Catálogo</button><h1>Sobre este esboço</h1></div></div>
    <div class="w notes"><p class="lede">Versão 2 do app da DBC Gases e Locações: visual de balcão e catálogo técnico, com a lista em linhas, código e medida em destaque e fechamento do pedido em etapas com cupom. As funções são as mesmas da versão 1.</p>${$('notes-src').innerHTML}</div>`;
  }
};

const L = {
  prod(){
    const p=byId(S.prod), v=p.vars[S.variant];
    return `<div class="sh-h w"><h3>${catOf(p).name}</h3><button class="x" data-close aria-label="Fechar">${svg('close',2)}</button></div>
    <div class="sh-b"><div class="w">
      <div class="pd-top"><span class="ico">${svg(catOf(p).icon,1.4)}</span><div><span class="sku">${p.brand.toUpperCase()} · ${p.sku}</span><h2 class="pd-name">${p.name}</h2></div></div>
      <div class="sl">${p.gas?'Como você quer o gás':'Opções'} · preço por ${p.unit}</div>
      <table class="vt"><tbody>${p.vars.map((x,i)=>`<tr><td><button class="vr" role="radio" data-var="${i}" aria-checked="${i===S.variant}"><span class="rd"></span><span><b>${x.l}</b>${x.s?`<small>${x.s}</small>`:''}</span><span class="vp">${brl(x.p)}</span></button></td></tr>`).join('')}</tbody></table>
      ${p.gas?`<div class="flag">Na recarga, o entregador leva o cilindro cheio e recolhe o seu vazio. Cilindros vão só de caminhonete, com entrega agendada.</div>`:''}
      <div class="flag ok">${p.stock} ${p.unit==='kg'?'kg':'em estoque'} na loja · retire hoje ou receba ${p.gas?'amanhã':'em até 3 h'}</div>
      <div class="sl">Ficha técnica</div>
      <dl class="dl">${p.specs.map(s=>`<dt>${s[0]}</dt><dd>${s[1]}</dd>`).join('')}</dl>
    </div></div>
    <div class="sh-f"><div class="w"><div class="stp"><button data-qty="-1" aria-label="Menos">−</button><span>${S.qty}</span><button data-qty="1" aria-label="Mais">+</button></div>
      <button class="go" data-add>Adicionar <span class="mono">${brl(v.p*S.qty)}</span></button></div></div>`;
  },
  cart(){
    const t=totals();
    return `<div class="sh-h w"><h3>Carrinho · ${cartQty()}</h3><button class="x" data-close aria-label="Fechar">${svg('close',2)}</button></div>
    <div class="sh-b"><div class="w">${S.cart.length?S.cart.map((c,i)=>{const p=byId(c.id),v=p.vars[c.v];return `<div class="cl"><div><span class="sku">${p.sku} · ${v.l}</span><div class="nm">${p.name}</div><span class="pu">${brl(v.p)} por ${p.unit}</span></div>
      <div class="pr"><span class="tot">${brl(lineTotal(c))}</span><div class="stp sm"><button data-cq="${i}" data-d="-1" aria-label="Menos">−</button><span>${c.q}</span><button data-cq="${i}" data-d="1" aria-label="Mais">+</button></div></div></div>`}).join('')
      +(hasGas()?`<div class="flag">Seu pedido tem cilindro: a entrega será de caminhonete, agendada.</div>`:'')
      +`<div class="rl" style="padding:14px 0 4px;font:600 13px var(--f-mono)"><span>Subtotal</span><span>${brl(t.sub)}</span></div><div class="rl d" style="font:600 13px var(--f-mono);padding-bottom:14px"><span>No Pix</span><span>${brl(t.sub*.95)}</span></div>`
      :`<div class="none">Seu carrinho está vazio.</div>`}</div></div>
    <div class="sh-f"><div class="w">${S.cart.length?`<button class="go" data-view="checkout">Fechar pedido <span class="mono">${brl(t.sub)}</span></button>`:`<button class="go ink" data-close>Ver catálogo</button>`}</div></div>`;
  },
  drawer(){
    return `<div class="brand">${LOCKUP}</div>
    <ul class="nav">
      <li><button data-home>${svg('list',2)}Catálogo<small>${P.length} itens</small></button></li>
      <li><button data-cart>${svg('cart',2)}Carrinho<small>${cartQty()} itens</small></button></li>
      <li><button data-view="orders">${svg('box',2)}Meus pedidos<small>1 a caminho</small></button></li>
      <li><button data-view="notes">${svg('info',2)}Sobre este esboço</button></li></ul>
    <div class="dstore"><b>Loja DBC</b>Rua Vinte de Maio, nº 320 · Bairro dos Cotianos<br>Piedade - SP · CEP 18170-000<div class="ph">${STORE_TEL}</div>
      <div class="acts"><a class="c1" href="tel:+551533442737">${svg('phone',2)}Ligar</a><a class="c2" href="${MAPS}" target="_blank" rel="noopener">${svg('pin',2)}Mapa</a></div></div>`;
  }
};

let timerId;
function renderChrome(){
  $('brand').innerHTML=LOCKUP;
  $('cn').innerHTML=svg('cart',2.2)+cartQty();
  $('cv').textContent=brl(totals().sub);
  $('strip').innerHTML=`<a href="${MAPS}" target="_blank" rel="noopener">${svg('pin',2)}Rua Vinte de Maio, 320 · Piedade - SP</a><a class="ph" href="tel:+551533442737">${svg('phone',2)}(15) 3344-2737</a>`;
}
function renderView(top=true){
  $('view').innerHTML=V[S.view]();
  renderChrome();
  if(top) window.scrollTo(0,0);
  clearInterval(timerId);
  if(S.view==='pix'){drawQR();let s=899;timerId=setInterval(()=>{const el=$('timer');if(!el){clearInterval(timerId);return}s=Math.max(0,s-1);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
  const q=$('q'); if(q) q.addEventListener('input',()=>{S.q=q.value;const keep=q.selectionStart;renderView(false);const n=$('q');n.focus();try{n.setSelectionRange(keep,keep)}catch(_){}});
}
function renderLayer(){
  const el=$('layer');
  if(!S.layer){el.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  el.innerHTML=`<div class="scrim" data-close></div>`+(S.layer==='drawer'?`<aside class="drawer" aria-label="Menu">${L.drawer()}</aside>`:`<section class="sheet" role="dialog" aria-modal="true">${L[S.layer]()}</section>`);
}
function drawQR(){
  const c=$('qr'); if(!c) return; const x=c.getContext('2d'), n=29;
  x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#00213F';
  let seed=Number(S.orderNo); const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const finder=(a,b)=>(a<8&&b<8)||(a>=n-8&&b<8)||(a<8&&b>=n-8);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(!finder(i,j)&&rnd()>.52) x.fillRect(i,j,1,1)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#00213F';x.fillRect(a+2,b+2,3,3)});
}
function open(layer){S.layer=layer;renderLayer()}
function close(){S.layer=null;renderLayer()}
function go(view){S.layer=null;renderLayer();S.view=view;renderView()}
function addToCart(id,v,q){const ex=S.cart.find(c=>c.id===id&&c.v===v);ex?ex.q+=q:S.cart.push({id,v,q})}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[role="button"],.scrim'); if(!b) return;
  const d=b.dataset;
  if('quick' in d){ e.stopPropagation(); const p=byId(d.quick); addToCart(p.id,0,1); toast(`${p.sku} adicionado`); return renderView(false); }
  if('close' in d) return close();
  if('drawer' in d) return open('drawer');
  if('cart' in d) return open('cart');
  if('home' in d) return go('catalog');
  if('view' in d) return go(d.view);
  if('dept' in d){ S.dept=d.dept; renderView(false); const nav=document.querySelector('.depts');if(nav&&window.scrollY>nav.offsetTop) window.scrollTo(0,nav.offsetTop-60); return; }
  if('clear' in d){ S.q=''; return renderView(false); }
  if('repeat' in d){ DEFAULT_CART().forEach(c=>addToCart(c.id,c.v,c.q)); toast('Último pedido no carrinho'); renderView(false); return open('cart'); }
  if('p' in d){ S.prod=d.p; S.variant=0; S.qty=1; return open('prod'); }
  if('var' in d){ S.variant=+d.var; return renderLayer(); }
  if('qty' in d){ S.qty=Math.max(1,S.qty+ +d.qty); return renderLayer(); }
  if('add' in d){ addToCart(S.prod,S.variant,S.qty); toast('Adicionado ao carrinho'); close(); return renderView(false); }
  if('cq' in d){ const c=S.cart[+d.cq]; c.q+= +d.d; if(c.q<1) S.cart.splice(+d.cq,1); renderLayer(); return renderChrome(); }
  if('ship' in d){ if(d.ship==='moto'&&hasGas()) return; S.ship=d.ship; return renderView(false); }
  if('pay' in d){ S.pay=d.pay; return renderView(false); }
  if('doc' in d){ S.doc=d.doc; return renderView(false); }
  if('place' in d){ if(S.pay==='pix') return go('pix'); toast(S.pay==='card'?'Pagamento aprovado':'Boleto gerado'); return go('orders'); }
  if('copy' in d){ const code=$('pixcode').textContent; try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado'),selectCode)}catch(_){selectCode()} return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.layer) close(); });
function selectCode(){const el=$('pixcode');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
renderView();
})();
</script>
