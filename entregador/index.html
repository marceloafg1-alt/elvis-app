<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DBC Entregas">
<meta name="theme-color" content="#00213F">
<meta name="format-detection" content="telephone=no">
<title>DBC Entregas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* App do entregador: mesmo visual da versão 2. Lista as entregas, "Saí para entrega" e confirmação com o código do cliente. */
:root{
  --bg-top:#DDE8F3; --bg:#F5F7FA; --card:#FFFFFF; --ink:#0D1B2A; --muted:#66768A; --line:#E3E9F0;
  --tint:#E8F0F8; --tint-ink:#0E3A66; --navy:#00213F; --navy-2:#0D4677; --orange:#F28A26;
  --ok:#17824B; --ok-bg:#E3F4EA; --warn:#9A5600; --warn-bg:#FFF1DE; --bad:#B42318; --bad-bg:#FDECEA;
  --shadow:0 12px 30px -18px rgba(0,33,63,.35); --scrim:rgba(0,20,40,.45);
  --hero:radial-gradient(120% 90% at 0% 0%,#1C6BA8 0%,transparent 55%),linear-gradient(160deg,#0E4C82 0%,#00213F 78%);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gl:max(18px,env(safe-area-inset-left,0px)); --gr:max(18px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg-top:#0D2440; --bg:#07111C; --card:#0F1D2D; --ink:#EAF0F7; --muted:#97A8BB; --line:#1D3047;
  --tint:#16304B; --tint-ink:#8CC6EC; --ok:#4CC683; --ok-bg:#0F2A1C; --warn:#F2B35A; --warn-bg:#2A1F0D; --bad:#FF8A80; --bad-bg:#2D1414;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6);
  --hero:radial-gradient(120% 90% at 0% 0%,#1A5E98 0%,transparent 55%),linear-gradient(160deg,#0D3C68 0%,#061A30 78%); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 420px) no-repeat,var(--bg);color:var(--ink);font:16px/1.4 var(--f);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--st);z-index:40;background:var(--bg-top)}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;flex:none}
.w{max-width:640px;margin:0 auto;padding:calc(18px + var(--st)) var(--gr) calc(40px + var(--sb)) var(--gl)}
.top{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500}
.brand .lg{height:40px;padding:0 12px;border-radius:12px;background:#00213F;display:grid;place-items:center}
.brand .lg svg{height:26px;width:auto;display:block}
.hello{font-size:clamp(32px,9vw,42px);font-weight:600;letter-spacing:-.025em;margin:4px 0 0;line-height:1.05}
.sub{color:var(--muted);font-size:14.5px;margin:-4px 0 0}
.hero{margin-top:18px;border-radius:30px;padding:20px;color:#fff;background:var(--hero);box-shadow:0 24px 40px -24px rgba(0,33,63,.7);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(242,138,38,.35),transparent 70%);pointer-events:none}
.stat{background:rgba(255,255,255,.1);border-radius:18px;padding:12px;border:0;color:#fff;text-align:left;cursor:pointer;position:relative;z-index:1}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.stat span{font-size:13.5px;color:#D7E5F3}
.stat[aria-pressed="true"]{background:#fff;color:#00213F}.stat[aria-pressed="true"] span{color:#0E3A66}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:20px calc(-1 * var(--gr)) 14px calc(-1 * var(--gl));padding:2px var(--gr) 4px var(--gl)}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ch b{font-size:18px;font-weight:600}
.ch small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.st{font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap}
.st.go{background:var(--warn-bg);color:var(--warn)}.st.rd{background:var(--tint);color:var(--tint-ink)}.st.ok{background:var(--ok-bg);color:var(--ok)}.st.wait{background:var(--line);color:var(--muted)}
.addr{display:flex;gap:12px;align-items:center;background:var(--tint);color:var(--tint-ink);border-radius:16px;padding:12px 14px;font-weight:500;line-height:1.35}
.addr .i{flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.acts{display:flex;gap:10px}
.btn{flex:1;height:52px;border:0;border-radius:999px;font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 12px 22px -14px rgba(0,33,63,.8)}
.btn.or{background:var(--orange);box-shadow:0 12px 22px -14px rgba(242,138,38,.9)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;flex:0 0 52px}
.btn.ghost.wide{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.5}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:28px 28px 0 0;padding:12px var(--gr) calc(22px + var(--sb)) var(--gl);animation:up .22s ease-out;max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.sheet p{margin:0 0 16px;color:var(--muted)}
.code{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.code input{height:68px;text-align:center;font:700 30px var(--mono);border:2px solid var(--line);border-radius:18px;background:var(--card);outline:none;min-width:0}
.code input:focus{border-color:var(--navy-2)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14.5px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;border-radius:999px;padding:12px 18px;font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:var(--shadow)}
.toast .i{width:16px;height:16px;color:var(--orange)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
</style>
</head>
<body>
<main class="w" id="app"></main>
<div id="layer"></div>
<script src="../data/store.js?v=12"></script>
<script>
const D=window.DBCStore, $=id=>document.getElementById(id);
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOCKUP = `<svg viewBox="-6 -6 580 232" role="img" aria-label="DBC Gases e Locações"><defs><clipPath id="sq"><rect x="0" y="0" width="200" height="145"/></clipPath></defs><rect x="0" y="0" width="200" height="145" fill="#F28A26"/><g clip-path="url(#sq)" fill="none" stroke-linecap="round"><path d="M4 168 L58 92" stroke="#00213F" stroke-width="30"/><path d="M54 98 L74 72" stroke="#00213F" stroke-width="19"/><path d="M70 76 Q112 34 178 22" stroke="#00213F" stroke-width="8"/><path d="M26 150 L60 103" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="3"/><path d="M176 22 L186 20" stroke="#FFFFFF" stroke-width="7"/></g><rect x="1.5" y="1.5" width="197" height="142" fill="none" stroke="#FFFFFF" stroke-width="3"/><g fill="#1E95D3"  transform="translate(206.21 145) scale(0.08439 -0.09732)"><path transform="translate(0 0)" d="M664 0C1117 0 1397 280 1397 745C1397 1210 1117 1490 664 1490H116V0ZM469 302V1188H644C905 1188 1044 1068 1044 745C1044 422 905 302 649 302Z"/><path transform="translate(1480 0)" d="M116 0H780C1110 0 1297 176 1297 416C1297 632 1141 767 962 774V790C1124 823 1239 941 1239 1112C1239 1337 1067 1490 734 1490H116ZM469 285V647H704C843 647 929 572 929 456C929 350 855 285 697 285ZM469 876V1208H680C802 1208 879 1145 879 1045C879 938 793 876 674 876Z"/><path transform="translate(2841 0)" d="M787 -20C1192 -20 1419 260 1446 526H1089C1064 381 954 290 794 290C580 290 443 445 443 744C443 1033 577 1200 796 1200C956 1200 1065 1109 1088 964H1445C1404 1311 1141 1510 787 1510C390 1510 82 1236 82 744C82 255 384 -20 787 -20Z"/></g><g fill="#F28A26" stroke="#FFFFFF" stroke-width="0"  transform="translate(5.56 212) scale(0.02686 -0.02953)"><path transform="translate(0 0)" d="M726 -20C1105 -20 1413 205 1480 613L1516 832H856L809 544H1078C1047 420 931 332 747 332C582 332 503 428 503 600C503 866 645 1158 927 1158C1043 1158 1110 1100 1118 998H1526C1546 1315 1273 1510 936 1510C435 1510 91 1096 91 597C91 213 335 -20 726 -20Z"/><path transform="translate(1546 0)" d="M-47 0H421L550 286H1009L1047 0H1489L1235 1490H683ZM686 588C768 770 843 965 916 1159C929 965 945 770 969 588Z"/><path transform="translate(3174 0)" d="M630 -18C1007 -18 1237 145 1286 440C1323 666 1213 825 895 896L778 922C642 952 589 993 601 1064C612 1130 675 1178 800 1178C931 1178 984 1121 975 1024H1363C1409 1316 1192 1510 831 1510C477 1510 221 1319 175 1036C136 803 275 672 529 616L674 584C833 549 885 507 874 440C862 366 784 314 655 314C499 314 420 387 436 524H52C-8 150 241 -18 630 -18Z"/><path transform="translate(4538 0)" d="M3 0H1073L1127 326H461L505 594H1119L1172 912H558L600 1164H1270L1324 1490H250Z"/><path transform="translate(5812 0)" d="M630 -18C1007 -18 1237 145 1286 440C1323 666 1213 825 895 896L778 922C642 952 589 993 601 1064C612 1130 675 1178 800 1178C931 1178 984 1121 975 1024H1363C1409 1316 1192 1510 831 1510C477 1510 221 1319 175 1036C136 803 275 672 529 616L674 584C833 549 885 507 874 440C862 366 784 314 655 314C499 314 420 387 436 524H52C-8 150 241 -18 630 -18Z"/><path transform="translate(7584 0)" d="M3 0H1073L1127 326H461L505 594H1119L1172 912H558L600 1164H1270L1324 1490H250Z"/><path transform="translate(9266 0)" d="M3 0H1009L1063 326H461L654 1490H250Z"/><path transform="translate(10424 0)" d="M720 -20C1229 -20 1560 393 1560 892C1560 1292 1297 1510 932 1510C421 1510 91 1096 91 597C91 199 352 -20 720 -20ZM737 332C581 332 502 421 502 594C502 844 624 1158 915 1158C1071 1158 1149 1069 1149 896C1149 644 1028 332 737 332Z"/><path transform="translate(12014 0)" d="M714 -20C1140 -20 1403 290 1465 544H1055C1014 417 899 332 741 332C586 332 502 418 502 595C502 851 635 1158 921 1158C1060 1158 1124 1073 1119 946H1529C1551 1310 1300 1510 926 1510C418 1510 91 1093 91 594C91 197 345 -20 714 -20Z"/><path transform="translate(13546 0)" d="M-47 0H421L550 286H1009L1047 0H1489L1235 1490H683ZM686 588C768 770 843 965 916 1159C929 965 945 770 969 588Z"/><path transform="translate(15174 0)" d="M477 -412H635C808 -412 889 -364 910 -236C927 -132 856 -68 730 -84L749 -19C1154 -3 1405 297 1465 544H1055C1014 417 899 332 741 332C586 332 502 418 502 595C502 851 635 1158 921 1158C1060 1158 1124 1073 1119 946H1529C1551 1310 1300 1510 926 1510C418 1510 91 1093 91 594C91 236 297 25 608 -14L553 -166H653C709 -166 730 -183 723 -223C716 -263 689 -281 633 -281H498Z"/><path transform="translate(16706 0)" d="M720 -20C1229 -20 1560 393 1560 892C1560 1292 1297 1510 932 1510C421 1510 91 1096 91 597C91 199 352 -20 720 -20ZM737 332C581 332 502 421 502 594C502 844 624 1158 915 1158C1071 1158 1149 1069 1149 896C1149 644 1028 332 737 332ZM1120 1628C1256 1628 1383 1736 1420 1942H1224C1210 1872 1184 1831 1128 1831C1059 1831 1027 1948 877 1948C739 1948 616 1846 577 1636H775C790 1709 823 1748 870 1748C944 1748 968 1628 1120 1628Z"/><path transform="translate(18296 0)" d="M3 0H1073L1127 326H461L505 594H1119L1172 912H558L600 1164H1270L1324 1490H250Z"/><path transform="translate(19570 0)" d="M630 -18C1007 -18 1237 145 1286 440C1323 666 1213 825 895 896L778 922C642 952 589 993 601 1064C612 1130 675 1178 800 1178C931 1178 984 1121 975 1024H1363C1409 1316 1192 1510 831 1510C477 1510 221 1319 175 1036C136 803 275 672 529 616L674 584C833 549 885 507 874 440C862 366 784 314 655 314C499 314 420 387 436 524H52C-8 150 241 -18 630 -18Z"/></g></svg>`;
const I={pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'};
const svg=(k,sw=1.8)=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
const SHIP_L={moto:'Moto',truck:'Caminhonete'};
const S={f:'ready',sheet:null,err:''};
const hm=iso=>iso?new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const isToday=iso=>iso&&new Date(iso).toDateString()===new Date().toDateString();
const F={
  ready:['Para sair',o=>o.status===2],
  route:['Em rota',o=>o.status===3],
  prep:['Em separação',o=>o.status===0||o.status===1],
  done:['Entregues hoje',o=>o.status===4&&isToday(o.history[4])]
};
function toast(m){const d=document.createElement('div');d.className='toast';d.innerHTML=svg('check',3)+esc(m);document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function items(o){return o.items.reduce((a,i)=>a+i[2],0)}
function card(o){
  const st={0:['Na loja','wait'],1:['Separando','wait'],2:['Pronto para sair','rd'],3:['Em rota','go'],4:['Entregue','ok']}[o.status];
  const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(D.addrOf(o));
  return `<article class="card">
    <div class="ch"><span><b>#${o.no} · ${esc(o.customer||'Cliente')}</b><small>${items(o)} ${items(o)===1?'item':'itens'} · ${SHIP_L[o.ship]||''} · ${brl(D.totals(o).total)} · pago</small></span><span class="st ${st[1]}">${st[0]}</span></div>
    <a class="addr" href="${maps}" target="_blank" rel="noopener">${svg('pin',2)}<span>${esc(D.addrOf(o))}</span></a>
    <div class="meta">${o.status>=3&&o.history[3]?`<span>Saiu às ${hm(o.history[3])}</span>`:''}${o.status===4?`<span>Entregue às ${hm(o.history[4])}</span>`:''}</div>
    ${o.status===2?`<div class="acts"><a class="btn ghost" href="tel:+55${D.phoneOf(o).replace(/\D/g,'')}" aria-label="Ligar para o cliente">${svg('phone',2)}</a><button class="btn or" data-out="${o.no}">${svg('truck',2)}Saí para entrega</button></div>`:''}
    ${o.status===3?`<div class="acts"><a class="btn ghost" href="tel:+55${D.phoneOf(o).replace(/\D/g,'')}" aria-label="Ligar para o cliente">${svg('phone',2)}</a><button class="btn" data-deliver="${o.no}">${svg('check',2.4)}Confirmar entrega</button></div>`:''}
  </article>`;
}
function render(){
  const all=D.orders().filter(o=>o.ship!=='pickup'&&o.status!==-1), c=k=>all.filter(F[k][1]).length, list=all.filter(F[S.f][1]);
  if(S.f==='ready')list.sort((a,b)=>(a.history[2]||'').localeCompare(b.history[2]||''));
  $('app').innerHTML=`<section class="top"><div class="brand"><span class="lg">${LOCKUP}</span>Entregas</div>
    <h1 class="hello">Suas entregas</h1><p class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</p></section>
    <section class="hero">${['ready','route','done'].map(k=>`<button class="stat" data-f="${k}" aria-pressed="${S.f===k}"><b>${c(k)}</b><span>${F[k][0]}</span></button>`).join('')}</section>
    <div class="chips">${Object.entries(F).map(([k,[l]])=>`<button class="chip" data-f="${k}" aria-pressed="${S.f===k}">${l} (${c(k)})</button>`).join('')}</div>
    ${list.length?list.map(card).join(''):`<div class="empty">${{ready:'Nenhum pedido pronto para sair agora.',route:'Nenhuma entrega em rota.',prep:'Nada em separação na loja.',done:'Nenhuma entrega concluída hoje.'}[S.f]}</div>`}
    <p class="note">Peça ao cliente o código de 4 números que aparece no app dele.<br>Problema na entrega? Ligue para a loja: <a href="tel:+551533442737"><b>(15) 3344-2737</b></a></p>`;
}
function sheet(){
  const el=$('layer');
  if(!S.sheet){el.innerHTML='';return}
  const o=D.order(S.sheet);
  el.innerHTML=`<div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Confirmar entrega"><div class="grab"></div>
    <h2>Código de entrega</h2><p>Pedido #${o.no} · ${esc(o.customer||'')}. Peça ao cliente o código que aparece no app.</p>
    ${S.err?`<div class="err">${esc(S.err)}</div>`:''}
    <div class="code">${[0,1,2,3].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Número ${i+1}" data-ci="${i}">`).join('')}</div>
    <div class="acts"><button class="btn ghost wide" data-close>Voltar</button><button class="btn or" data-confirm>${svg('check',2.4)}Confirmar</button></div></section>`;
  const ins=[...el.querySelectorAll('[data-ci]')];ins[0].focus();
  ins.forEach((inp,i)=>{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))confirm()});
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()});
    inp.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(t.length===4){e.preventDefault();t.split('').forEach((c,j)=>ins[j].value=c);confirm()}})});
}
function confirm(){
  const code=[...document.querySelectorAll('[data-ci]')].map(x=>x.value).join('');
  if(code.length<4){S.err='Digite os 4 números.';return sheet()}
  if(D.confirmDelivery(S.sheet,code,'entregador')){const no=S.sheet;S.sheet=null;S.err='';sheet();S.f='done';render();toast('Pedido #'+no+' entregue')}
  else{S.err='Código não confere. Confira com o cliente.';sheet()}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,.scrim');if(!b)return;const d=b.dataset;
  if('f' in d){S.f=d.f;return render()}
  if('out' in d){D.setStatus(d.out,3,'entregador');toast('Saída registrada. Boa entrega!');S.f='route';return render()}
  if('deliver' in d){S.sheet=d.deliver;S.err='';return sheet()}
  if('close' in d){S.sheet=null;S.err='';return sheet()}
  if('confirm' in d)return confirm();
});
D.onChange(()=>render());
render();
</script>
</body>
</html>
